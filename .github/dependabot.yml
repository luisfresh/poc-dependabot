---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: npm
    directory: "/javascript"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix(deps)"
    allow:
      - dependency-type: "all"
    labels:
      - "dependencies"


  - package-ecosystem: bundler
    directory: "/ruby"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix(deps)"
    allow:
      - dependency-type: "all"
    labels:
      - "dependencies"


